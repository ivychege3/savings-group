<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAVASCRIPT</title>
</head>
<body>
  <script language="javascript">
   var name = prompt("Enter employee name");
     var hours = eval(prompt("Enter hours worked"));
     var rate = eval(prompt("Enter Rate per hr"));
     var salary = hours*rate;
     document.write("Name:" +name+"<br>");
     document.write("Salary:"+salary+"<br>");
     if(salary>=20000)
      var tax =salary*0.1;
       document.write(tax);
      else
       document.write("tax exempted ");
    </script>
</body>
</html>
